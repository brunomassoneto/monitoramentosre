# Workflow do GitHub Actions: roda o robô CVM automaticamente.
#
# Este arquivo PRECISA ficar no caminho:  .github/workflows/cvm-robo.yml
#
# O que ele faz:
#  - dispara o robô com alta frequência das 07h às 24h (horário de Brasília),
#    e fica em silêncio de madrugada (00h-07h BRT), quando não há expediente
#    na CVM e a chance de uma oferta nova é ~zero;
#  - também pode ser disparado manualmente pelo botão "Run workflow"
#    (com opção de só testar o Telegram ou inspecionar os dados);
#  - usa o cache do Actions para preservar o arquivo estado_ofertas.json
#    entre uma execução e outra (o repositório fica limpo, sem commits).

name: Robô CVM → Telegram

on:
  schedule:
    # IMPORTANTE: o cron do GitHub Actions é sempre em UTC.
    #
    # ESTRATÉGIA — saturar o agendador SÓ no horário que importa. O
    # `schedule:` do GitHub Actions pula MUITAS execuções sob carga (best
    # effort, sem SLA). Medindo run a dia/hora (jun/26, 28 dias úteis, 237
    # runs agendadas), a taxa de "pegar" por tentativa de madrugada
    # (00h-07h BRT) foi de só ~2%, contra ~4-5% durante o dia (07h-24h
    # BRT) — provavelmente por causa do load global do GitHub coincidir
    # com o horário comercial nos EUA/Europa. Como o repo é público (minutos
    # ilimitados) e não há ofertas de madrugada mesmo, a tática agora é:
    # ZERO tentativas de madrugada, e REALOCAR essa densidade pro período
    # do dia, onde cada tentativa converte melhor.
    #
    # Evitamos o minuto :00 (pico do agendador onde o skip rate é mais
    # alto). Os outros minutos são usados sem cerimônia.
    #
    # Refs:
    #   docs.github.com/en/actions/.../events-that-trigger-workflows#schedule
    #   "Scheduled workflows can be delayed during periods of high loads
    #    of GitHub Actions workflow runs."
    #
    # --- Conversão BRT -> UTC (BRT = UTC-3), janela 07h-24h BRT ---
    # 07h-24h BRT cobre dois trechos em UTC: 10h-23h (mesmo dia UTC) e
    # 00h-02h do dia UTC seguinte (esse 2º trecho corresponde às 21h-24h
    # BRT do dia anterior, por isso o dia-da-semana do cron é deslocado
    # +1 nesse trecho). Sem isso, perderíamos ~3h úteis por virada de dia.
    #
    # Dias úteis (seg-sex BRT), a cada 2 min (exceto :00) — ~29 disparos/h:
    - cron: '2-58/2 10-23 * * 1-5'   # seg-sex BRT, 07h-21h BRT (mesmo dia UTC)
    - cron: '2-58/2 0-2 * * 2-6'     # seg-sex BRT, 21h-24h BRT (vira p/ UTC do dia seguinte)
    # Fim de semana (sáb-dom BRT), a cada 10 min — 6 disparos/h (menor
    # movimento de ofertas, não precisa da mesma densidade):
    - cron: '10,20,30,40,50 10-23 * * 0,6'  # sáb-dom BRT, 07h-21h BRT
    - cron: '10,20,30,40,50 0-2 * * 0,1'    # sáb-dom BRT, 21h-24h BRT

  # Permite rodar na mão pela aba "Actions" do GitHub (útil para testar).
  workflow_dispatch:
    inputs:
      modo:
        description: 'O que executar'
        type: choice
        default: verificar
        options:
          - verificar          # verificação normal (envia alertas de ofertas novas)
          - testar-telegram    # só envia uma mensagem de teste
          - inspecionar        # só baixa os dados e mostra as colunas do CSV
          - semear-silencioso  # marca ofertas atuais como já-vistas (sem notificar)

# Evita que duas execuções rodem ao mesmo tempo (e disputem o cache).
concurrency:
  group: cvm-robo
  cancel-in-progress: false

jobs:
  verificar-ofertas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Restaura o estado_ofertas.json da execução anterior.
      # A 'key' é única por execução (github.run_id), então toda run é um
      # "cache miss" no key exato -> o Actions restaura pelo 'restore-keys'
      # (a versão mais recente) e, no fim do job, salva um cache novo com o
      # estado atualizado. É o padrão recomendado para "cache que muda".
      - name: Restaurar o estado da última execução
        uses: actions/cache@v4
        with:
          path: estado_ofertas.json
          key: cvm-estado-${{ github.run_id }}
          restore-keys: |
            cvm-estado-

      - name: Rodar o robô
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Em execução agendada não há "input"; o padrão vira 'verificar'.
          MODO: ${{ github.event.inputs.modo || 'verificar' }}
        run: |
          echo "Modo: $MODO"
          case "$MODO" in
            testar-telegram)
              python cvm_telegram_bot.py --test-telegram
              ;;
            inspecionar)
              python cvm_telegram_bot.py --inspect
              ;;
            semear-silencioso)
              python cvm_telegram_bot.py --seed-silent
              ;;
            *)
              python cvm_telegram_bot.py
              ;;
          esac
